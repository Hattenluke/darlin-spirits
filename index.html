  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7733e006-442c-4e50-97e1-38789c517a6f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"78c7e2f0-6b96-4be0-b5e3-f3cf77b65e47\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"d1d4bdf4-5f8c-45a8-b7e5-d802411fcb22\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1fac628c-6047-48c0-a83f-b48a2a78029a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* =====================================================================\n   Darlin' — Color tokens\n   Authoritative source: \"Darlin' Guideline Print.pdf\" (33-pp brand book).\n   Primary palette (exact spec values):\n     Burnished Clay  #643839  PANTONE 1817 C  — warm clay/wine, the hero\n     Deep Root       #372222  PANTONE 4975 C  — deep brown-maroon anchor\n     Mist Grey       #E5E5E4  PANTONE 663 C   — cool neutral, keeps it modern\n   No metallic/gold is specified by the brand book; the system is a warm\n   monochrome of clay + root over light neutrals.\n   ===================================================================== */\n\n:root {\n  /* ---- Burnished Clay (primary brand hue) ---- */\n  --clay-50:  #F8EFED;\n  --clay-100: #EEDCD9;\n  --clay-200: #DDBBB6;\n  --clay-300: #C6928C;\n  --clay-400: #A96A64;\n  --clay-500: #874E4C;\n  --clay-600: #643839; /* core — Burnished Clay */\n  --clay-700: #522F30;\n  --clay-800: #402626;\n  --clay-900: #2C1A1B;\n\n  /* ---- Deep Root (darkest anchor) ---- */\n  --root-950: #160C0C;\n  --root-900: #241515;\n  --root-800: #301C1C;\n  --root-700: #372222; /* core — Deep Root */\n  --root-600: #472D2D;\n  --root-500: #5B3A39;\n\n  /* ---- Mist Grey (cool neutral) ---- */\n  --mist-50:  #FAFAF9;\n  --mist-100: #F1F1F0;\n  --mist-200: #E5E5E4; /* core — Mist Grey */\n  --mist-300: #D3D3D1;\n  --mist-400: #B4B4B1;\n  --mist-500: #8C8C88;\n  --mist-600: #6A6A66;\n\n  /* ---- Warm ivory paper (page/light surfaces) ---- */\n  --ivory-50:  #FBF9F5;\n  --ivory-100: #F4F0E9; /* page background */\n  --ivory-200: #EDE7DC;\n  --ivory-300: #E0D8C9;\n\n  --white: #FFFFFF;\n\n  /* ---- Semantic status (warm-compatible) ---- */\n  --sage:    #5E7355; /* success */\n  --sage-bg: #E8EDE2;\n  --honey:   #A9772A; /* warning */\n  --honey-bg:#F4E9D4;\n  --brick:   #9E3B2C; /* danger  */\n  --brick-bg:#F1DDD8;\n  --dusk:    #45606E; /* info    */\n  --dusk-bg: #E0E8EC;\n\n  /* =========================================================\n     Semantic aliases — reference these in components\n     ========================================================= */\n\n  /* Surfaces */\n  --surface-page:   var(--ivory-100);\n  --surface-card:   var(--white);\n  --surface-sunken: var(--ivory-200);\n  --surface-brand:  var(--clay-600);\n  --surface-ink:    var(--root-700);\n  --surface-accent: var(--root-700); /* deep emphasis blocks/CTAs */\n\n  /* Text */\n  --text-primary:     var(--root-700);\n  --text-secondary:   #6B4B49;\n  --text-muted:       #9A827F;\n  --text-inverse:     var(--mist-50);\n  --text-inverse-dim: #D9CCCA;\n  --text-brand:       var(--clay-600);\n  --text-accent:      var(--clay-600);\n  --text-on-accent:   var(--mist-50);\n\n  /* Lines & borders */\n  --border-subtle:  #E8E1D6;\n  --border-default: #DAD0C1;\n  --border-strong:  var(--clay-600);\n  --border-inverse: rgba(245,241,234,0.18);\n\n  /* Interaction */\n  --accent:          var(--clay-600);\n  --accent-hover:    var(--clay-700);\n  --accent-press:    var(--clay-800);\n  --accent-contrast: var(--mist-50);\n  --focus-ring:      rgba(100,56,57,0.48);\n\n  /* Selection */\n  --select-bg: var(--clay-100);\n  --select-fg: var(--root-700);\n\n  /* =========================================================\n     Legacy compatibility aliases (older component code) —\n     mapped onto the real palette so everything stays in-brand.\n     Prefer the semantic + clay/root/mist names above in new work.\n     ========================================================= */\n  --burgundy-50:  var(--clay-50);\n  --burgundy-100: var(--clay-100);\n  --burgundy-200: var(--clay-200);\n  --burgundy-300: var(--clay-300);\n  --burgundy-400: var(--clay-400);\n  --burgundy-500: var(--clay-500);\n  --burgundy-600: var(--clay-600);\n  --burgundy-700: var(--clay-700);\n  --burgundy-800: var(--clay-800);\n  --burgundy-900: var(--clay-900);\n\n  --ink-900: var(--root-900);\n  --ink-800: var(--root-800);\n  --ink-700: var(--root-700);\n  --ink-600: var(--root-600);\n\n  --paper-50:  var(--ivory-50);\n  --paper-100: var(--ivory-100);\n  --paper-200: var(--ivory-200);\n  --paper-300: var(--ivory-300);\n\n  --stone-100: var(--mist-100);\n  --stone-200: var(--mist-200);\n  --stone-300: var(--mist-300);\n  --stone-400: var(--mist-400);\n  --stone-500: var(--mist-500);\n\n  /* \"gold\" legacy accent → resolves to clay/root emphasis (no true gold) */\n  --gold-100: var(--clay-100);\n  --gold-200: var(--clay-200);\n  --gold-300: var(--clay-300);\n  --gold-400: var(--clay-400);\n  --gold-500: var(--clay-600);\n  --gold-600: var(--clay-700);\n  --gold-700: var(--clay-800);\n  --surface-gold:  var(--root-700);\n  --text-gold:     var(--clay-600);\n  --text-on-gold:  var(--mist-50);\n\n  /* status legacy names */\n  --amber: var(--honey); --amber-bg: var(--honey-bg);\n  --clay:  var(--brick); --clay-bg:  var(--brick-bg);\n  --slate: var(--dusk);  --slate-bg: var(--dusk-bg);\n}\n\n::selection { background: var(--select-bg); color: var(--select-fg); }\n<\u002Fstyle>\n  <style>/* Darlin' — Typography tokens\n   Two-sans system from the brand book:\n     Display / headings → Arpona      (sub: Hanken Grotesk) — Bold headlines, Medium subheads\n     Body / captions    → Abacaxi Dev.(sub: Figtree)        — Regular\n     Labels / running    → mono        (IBM Plex Mono)        — the guide's sideways labels\n   The custom script wordmark is the third voice (signature only, never body). */\n\n:root {\n  --font-display: \"Hanken Grotesk\", \"Helvetica Neue\", Arial, sans-serif; /* Arpona sub */\n  --font-sans:    \"Figtree\", \"Helvetica Neue\", Arial, sans-serif;        /* Abacaxi sub */\n  --font-body:    var(--font-sans);\n  --font-mono:    \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Weights */\n  --fw-regular: 400; /* @kind other */\n  --fw-medium:  500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:    700; /* @kind other */\n  --fw-black:   800; /* @kind other */\n\n  /* Type scale (rem, 16px base). Headlines run bold & tight per the book\n     (digital 48–72px); subheads Medium; body 14–20px at 140–160% line-height. */\n  --fs-display-2xl: 4.5rem;   /* 72px hero  */\n  --fs-display-xl:  3.5rem;   /* 56px */\n  --fs-display-lg:  2.75rem;  /* 44px */\n  --fs-display-md:  2rem;     /* 32px */\n  --fs-h1: 1.75rem;   /* 28px */\n  --fs-h2: 1.375rem;  /* 22px */\n  --fs-h3: 1.125rem;  /* 18px */\n  --fs-body-lg: 1.125rem; /* 18px */\n  --fs-body:    1rem;     /* 16px */\n  --fs-body-sm: 0.875rem; /* 14px */\n  --fs-caption: 0.75rem;  /* 12px */\n  --fs-overline:0.6875rem;/* 11px */\n\n  /* Line heights (book: heads 110–130%, body 140–160%) */\n  --lh-tight:   1.1;  /* @kind other */\n  --lh-snug:    1.25; /* @kind other */\n  --lh-normal:  1.45; /* @kind other */\n  --lh-relaxed: 1.6;  /* @kind other */\n\n  /* Letter spacing */\n  --ls-tight:   -0.02em; /* @kind other */\n  --ls-normal:  0;       /* @kind other */\n  --ls-wide:    0.04em;  /* @kind other */\n  --ls-overline:0.16em;  /* @kind other */ /* uppercase labels / overlines */\n\n  /* Semantic roles */\n  --text-hero:      var(--fw-bold) var(--fs-display-2xl)/var(--lh-tight) var(--font-display);\n  --text-display:   var(--fw-bold) var(--fs-display-lg)/var(--lh-tight) var(--font-display);\n  --text-title:     var(--fw-bold) var(--fs-h1)/var(--lh-snug) var(--font-display);\n  --text-heading:   var(--fw-semibold) var(--fs-h2)/var(--lh-snug) var(--font-display);\n  --text-body-role: var(--fw-regular) var(--fs-body)/var(--lh-relaxed) var(--font-sans);\n}\n<\u002Fstyle>\n  <style>/* Darlin' — Spacing & sizing (4px base grid) */\n:root {\n  --space-0: 0;\n  --space-1: 0.25rem;  /* 4  */\n  --space-2: 0.5rem;   /* 8  */\n  --space-3: 0.75rem;  /* 12 */\n  --space-4: 1rem;     /* 16 */\n  --space-5: 1.5rem;   /* 24 */\n  --space-6: 2rem;     /* 32 */\n  --space-7: 3rem;     /* 48 */\n  --space-8: 4rem;     /* 64 */\n  --space-9: 6rem;     /* 96 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-prose: 68ch;\n  --gutter: var(--space-5);\n\n  /* Control heights */\n  --control-sm: 34px;\n  --control-md: 42px;\n  --control-lg: 52px;\n}\n<\u002Fstyle>\n  <style>/* Darlin' — Radius & elevation\n   Corners are soft-but-modest; the brand leans warm/editorial, not bubbly.\n   Shadows are low, warm-tinted (maroon), never neutral gray. */\n:root {\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;   /* default card / control */\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n\n  /* Warm-tinted elevation (maroon shadow, not gray) */\n  --shadow-xs: 0 1px 2px rgba(42,18,20,0.06);\n  --shadow-sm: 0 2px 6px rgba(42,18,20,0.08);\n  --shadow-md: 0 8px 20px -6px rgba(42,18,20,0.14);\n  --shadow-lg: 0 18px 40px -12px rgba(42,18,20,0.22);\n  --shadow-gold: 0 6px 20px -6px rgba(42,18,20,0.28);\n\n  /* Insets */\n  --inset-hairline: inset 0 0 0 1px var(--border-default);\n  --inset-press:    inset 0 2px 4px rgba(42,18,20,0.12);\n}\n<\u002Fstyle>\n  <style>/* Darlin' — Motion\n   Gentle, warm, unhurried. Ease-out for entrances, subtle press-scale.\n   No bounces, no long parallax. */\n:root {\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n  --dur-slower: 600ms; /* @kind other */\n\n  --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-in-out:cubic-bezier(0.65, 0.05, 0.36, 1); /* @kind other */\n  --ease-soft:  cubic-bezier(0.33, 1, 0.68, 1); /* @kind other */\n\n  --press-scale: 0.97; /* @kind other */\n\n  --transition-control: background-color var(--dur-fast) var(--ease-out),\n                        color var(--dur-fast) var(--ease-out),\n                        border-color var(--dur-fast) var(--ease-out),\n                        box-shadow var(--dur-fast) var(--ease-out),\n                        transform var(--dur-fast) var(--ease-out); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* Darlin' — base element defaults & helpers.\n   Light touch: sets page voice; components own their own styling. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-primary);\n  font: var(--text-body-role);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 { margin: 0; color: var(--text-primary); text-wrap: balance; }\n\np { margin: 0; text-wrap: pretty; }\n\na {\n  color: var(--text-brand);\n  text-decoration: none;\n  text-underline-offset: 3px;\n  text-decoration-thickness: 1px;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { color: var(--accent-hover); text-decoration: underline; }\n\n:focus-visible {\n  outline: 2px solid transparent;\n  box-shadow: 0 0 0 3px var(--focus-ring);\n  border-radius: var(--radius-xs);\n}\n\nhr { border: 0; border-top: 1px solid var(--border-subtle); margin: var(--space-5) 0; }\n\n/* Utility voice classes (optional) */\n.ds-overline {\n  font: var(--fw-semibold) var(--fs-overline)/1 var(--font-sans);\n  letter-spacing: var(--ls-overline);\n  text-transform: uppercase;\n  color: var(--text-gold);\n}\n.ds-display { font: var(--text-display); }\n.ds-hero    { font: var(--text-hero); }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }\n}\n<\u002Fstyle>\n  <style>/* =====================================================================\n   Darlin' — Design System\n   Global entry point. Consumers link THIS file only.\n   Keep it as @import lines; declare no rules here.\n   ===================================================================== */\n\n/* Darlin' — Webfonts\n   The brand book specifies:\n     Primary typeface   → ARPONA   (headlines Bold / subheads Medium)\n     Secondary typeface → ABACAXI DEVANAGARI  (body + captions, Regular)\n   Both are commercial faces and were NOT supplied, so the type system uses\n   Google Fonts substitutes chosen for the closest fit:\n     Arpona   → Hanken Grotesk (geometric humanist sans, warm)\n     Abacaxi  → Figtree        (friendly neutral sans for running text)\n   The \"Darlin'\" script + \"Stay Darlin'\" wordmark are custom lettering\n   (shipped as SVG in assets/logo), not a font.\n   If licensed Arpona/Abacaxi files arrive, drop the woff2 here, replace the\n   @import with @font-face rules, and repoint the --font-* tokens. */\n\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url lette (exact spec values):\n     Burnished Clay  #643839  PANTONE 1817 C  — warm clay/wine, the hero\n     Deep Root       #372222  PANTONE 4975 C  — deep brown-maroon anchor\n     Mist Grey       #E5E5E4  PANTONE 663 C   — cool neutral, keeps it modern\n   No metallic/gold is specified by the brand book; the system is a warm\n   monochrome of clay + root over light neutrals.\n   ===================================================================== */\n\n:root {\n  /* ---- Burnished Clay (primary brand hue) ---- */\n  --clay-50:  #F8EFED;\n  --clay-100: #EEDCD9;\n  --clay-200: #DDBBB6;\n  --clay-300: #C6928C;\n  --clay-400: #A96A64;\n  --clay-500: #874E4C;\n  --clay-600: #643839; /* core — Burnished Clay */\n  --clay-700: #522F30;\n  --clay-800: #402626;\n  --clay-900: #2C1A1B;\n\n  /* ---- Deep Root (darkest anchor) ---- */\n  --root-950: #160C0C;\n  --root-900: #241515;\n  --root-800: #301C1C;\n  --root-700: #372222; /* core — Deep Root */\n  --root-600: #472D2D;\n  --root-500: #5B3A39;\n\n  /* ---- Mist Grey (cool neutral) ---- */\n  --mist-50:  #FAFAF9;\n  --mist-100: #F1F1F0;\n  --mist-200: #E5E5E4; /* core — Mist Grey */\n  --mist-300: #D3D3D1;\n  --mist-400: #B4B4B1;\n  --mist-500: #8C8C88;\n  --mist-600: #6A6A66;\n\n  /* ---- Warm ivory paper (page/light surfaces) ---- */\n  --ivory-50:  #FBF9F5;\n  --ivory-100: #F4F0E9; /* page background */\n  --ivory-200: #EDE7DC;\n  --ivory-300: #E0D8C9;\n\n  --white: #FFFFFF;\n\n  /* ---- Semantic status (warm-compatible) ---- */\n  --sage:    #5E7355; /* success */\n  --sage-bg: #E8EDE2;\n  --honey:   #A9772A; /* warning */\n  --honey-bg:#F4E9D4;\n  --brick:   #9E3B2C; /* danger  */\n  --brick-bg:#F1DDD8;\n  --dusk:    #45606E; /* info    */\n  --dusk-bg: #E0E8EC;\n\n  /* =========================================================\n     Semantic aliases — reference these in components\n     ========================================================= */\n\n  /* Surfaces */\n  --surface-page:   var(--ivory-100);\n  --surface-card:   var(--white);\n  --surface-sunken: var(--ivory-200);\n  --surface-brand:  var(--clay-600);\n  --surface-ink:    var(--root-700);\n  --surface-accent: var(--root-700); /* deep emphasis blocks/CTAs */\n\n  /* Text */\n  --text-primary:     var(--root-700);\n  --text-secondary:   #6B4B49;\n  --text-muted:       #9A827F;\n  --text-inverse:     var(--mist-50);\n  --text-inverse-dim: #D9CCCA;\n  --text-brand:       var(--clay-600);\n  --text-accent:      var(--clay-600);\n  --text-on-accent:   var(--mist-50);\n\n  /* Lines & borders */\n  --border-subtle:  #E8E1D6;\n  --border-default: #DAD0C1;\n  --border-strong:  var(--clay-600);\n  --border-inverse: rgba(245,241,234,0.18);\n\n  /* Interaction */\n  --accent:          var(--clay-600);\n  --accent-hover:    var(--clay-700);\n  --accent-press:    var(--clay-800);\n  --accent-contrast: var(--mist-50);\n  --focus-ring:      rgba(100,56,57,0.48);\n\n  /* Selection */\n  --select-bg: var(--clay-100);\n  --select-fg: var(--root-700);\n\n  /* =========================================================\n     Legacy compatibility aliases (older component code) —\n     mapped onto the real palette so everything stays in-brand.\n     Prefer the semantic + clay/root/mist names above in new work.\n     ========================================================= */\n  --burgundy-50:  var(--clay-50);\n  --burgundy-100: var(--clay-100);\n  --burgundy-200: var(--clay-200);\n  --burgundy-300: var(--clay-300);\n  --burgundy-400: var(--clay-400);\n  --burgundy-500: var(--clay-500);\n  --burgundy-600: var(--clay-600);\n  --burgundy-700: var(--clay-700);\n  --burgundy-800: var(--clay-800);\n  --burgundy-900: var(--clay-900);\n\n  --ink-900: var(--root-900);\n  --ink-800: var(--root-800);\n  --ink-700: var(--root-700);\n  --ink-600: var(--root-600);\n\n  --paper-50:  var(--ivory-50);\n  --paper-100: var(--ivory-100);\n  --paper-200: var(--ivory-200);\n  --paper-300: var(--ivory-300);\n\n  --stone-100: var(--mist-100);\n  --stone-200: var(--mist-200);\n  --stone-300: var(--mist-300);\n  --stone-400: var(--mist-400);\n  --stone-500: var(--mist-500);\n\n  /* \"gold\" legacy accent → resolves to clay/root emphasis (no true gold) */\n  --gold-100: var(--clay-100);\n  --gold-200: var(--clay-200);\n  --gold-300: var(--clay-300);\n  --gold-400: var(--clay-400);\n  --gold-500: var(--clay-600);\n  --gold-600: var(--clay-700);\n  --gold-700: var(--clay-800);\n  --surface-gold:  var(--root-700);\n  --text-gold:     var(--clay-600);\n  --text-on-gold:  var(--mist-50);\n\n  /* status legacy names */\n  --amber: var(--honey); --amber-bg: var(--honey-bg);\n  --clay:  var(--brick); --clay-bg:  var(--brick-bg);\n  --slate: var(--dusk);  --slate-bg: var(--dusk-bg);\n}\n\n::selection { background: var(--select-bg); color: var(--select-fg); }\n\n/* Darlin' — Typography tokens\n   Two-sans system from the brand book:\n     Display / headings → Arpona      (sub: Hanken Grotesk) — Bold headlines, Medium subheads\n     Body / captions    → Abacaxi Dev.(sub: Figtree)        — Regular\n     Labels / running    → mono        (IBM Plex Mono)        — the guide's sideways labels\n   The custom script wordmark is the third voice (signature only, never body). */\n\n:root {\n  --font-display: \"Hanken Grotesk\", \"Helvetica Neue\", Arial, sans-serif; /* Arpona sub */\n  --font-sans:    \"Figtree\", \"Helvetica Neue\", Arial, sans-serif;        /* Abacaxi sub */\n  --font-body:    var(--font-sans);\n  --font-mono:    \"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* Weights */\n  --fw-regular: 400; /* @kind other */\n  --fw-medium:  500; /* @kind other */\n  --fw-semibold:600; /* @kind other */\n  --fw-bold:    700; /* @kind other */\n  --fw-black:   800; /* @kind other */\n\n  /* Type scale (rem, 16px base). Headlines run bold & tight per the book\n     (digital 48–72px); subheads Medium; body 14–20px at 140–160% line-height. */\n  --fs-display-2xl: 4.5rem;   /* 72px hero  */\n  --fs-display-xl:  3.5rem;   /* 56px */\n  --fs-display-lg:  2.75rem;  /* 44px */\n  --fs-display-md:  2rem;     /* 32px */\n  --fs-h1: 1.75rem;   /* 28px */\n  --fs-h2: 1.375rem;  /* 22px */\n  --fs-h3: 1.125rem;  /* 18px */\n  --fs-body-lg: 1.125rem; /* 18px */\n  --fs-body:    1rem;     /* 16px */\n  --fs-body-sm: 0.875rem; /* 14px */\n  --fs-caption: 0.75rem;  /* 12px */\n  --fs-overline:0.6875rem;/* 11px */\n\n  /* Line heights (book: heads 110–130%, body 140–160%) */\n  --lh-tight:   1.1;  /* @kind other */\n  --lh-snug:    1.25; /* @kind other */\n  --lh-normal:  1.45; /* @kind other */\n  --lh-relaxed: 1.6;  /* @kind other */\n\n  /* Letter spacing */\n  --ls-tight:   -0.02em; /* @kind other */\n  --ls-normal:  0;       /* @kind other */\n  --ls-wide:    0.04em;  /* @kind other */\n  --ls-overline:0.16em;  /* @kind other */ /* uppercase labels / overlines */\n\n  /* Semantic roles */\n  --text-hero:      var(--fw-bold) var(--fs-display-2xl)/var(--lh-tight) var(--font-display);\n  --text-display:   var(--fw-bold) var(--fs-display-lg)/var(--lh-tight) var(--font-display);\n  --text-title:     var(--fw-bold) var(--fs-h1)/var(--lh-snug) var(--font-display);\n  --text-heading:   var(--fw-semibold) var(--fs-h2)/var(--lh-snug) var(--font-display);\n  --text-body-role: var(--fw-regular) var(--fs-body)/var(--lh-relaxed) var(--font-sans);\n}\n\n/* Darlin' — Spacing & sizing (4px base grid) */\n:root {\n  --space-0: 0;\n  --space-1: 0.25rem;  /* 4  */\n  --space-2: 0.5rem;   /* 8  */\n  --space-3: 0.75rem;  /* 12 */\n  --space-4: 1rem;     /* 16 */\n  --space-5: 1.5rem;   /* 24 */\n  --space-6: 2rem;     /* 32 */\n  --space-7: 3rem;     /* 48 */\n  --space-8: 4rem;     /* 64 */\n  --space-9: 6rem;     /* 96 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-prose: 68ch;\n  --gutter: var(--space-5);\n\n  /* Control heights */\n  --control-sm: 34px;\n  --control-md: 42px;\n  --control-lg: 52px;\n}\n\n/* Darlin' — Radius & elevation\n   Corners are soft-but-modest; the brand leans warm/editorial, not bubbly.\n   Shadows are low, warm-tinted (maroon), never neutral gray. */\n:root {\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;   /* default card / control */\n  --radius-lg: 16px;\n  --radius-xl: 24px;\n  --radius-pill: 999px;\n\n  /* Warm-tinted elevation (maroon shadow, not gray) */\n  --shadow-xs: 0 1px 2px rgba(42,18,20,0.06);\n  --shadow-sm: 0 2px 6px rgba(42,18,20,0.08);\n  --shadow-md: 0 8px 20px -6px rgba(42,18,20,0.14);\n  --shadow-lg: 0 18px 40px -12px rgba(42,18,20,0.22);\n  --shadow-gold: 0 6px 20px -6px rgba(42,18,20,0.28);\n\n  /* Insets */\n  --inset-hairline: inset 0 0 0 1px var(--border-default);\n  --inset-press:    inset 0 2px 4px rgba(42,18,20,0.12);\n}\n\n/* Darlin' — Motion\n   Gentle, warm, unhurried. Ease-out for entrances, subtle press-scale.\n   No bounces, no long parallax. */\n:root {\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n  --dur-slower: 600ms; /* @kind other */\n\n  --ease-out:   cubic-bezier(0.22, 0.61, 0.36, 1); /* @kind other */\n  --ease-in-out:cubic-bezier(0.65, 0.05, 0.36, 1); /* @kind other */\n  --ease-soft:  cubic-bezier(0.33, 1, 0.68, 1); /* @kind other */\n\n  --press-scale: 0.97; /* @kind other */\n\n  --transition-control: background-color var(--dur-fast) var(--ease-out),\n                        color var(--dur-fast) var(--ease-out),\n                        border-color var(--dur-fast) var(--ease-out),\n                        box-shadow var(--dur-fast) var(--ease-out),\n                        transform var(--dur-fast) var(--ease-out); /* @kind other */\n}\n\n/* Darlin' — base element defaults & helpers.\n   Light touch: sets page voice; components own their own styling. */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--surface-page);\n  color: var(--text-primary);\n  font: var(--text-body-role);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nh1, h2, h3, h4 { margin: 0; color: var(--text-primary); text-wrap: balance; }\n\np { margin: 0; text-wrap: pretty; }\n\na {\n  color: var(--text-brand);\n  text-decoration: none;\n  text-underline-offset: 3px;\n  text-decoration-thickness: 1px;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { color: var(--accent-hover); text-decoration: underline; }\n\n:focus-visible {\n  outline: 2px solid transparent;\n  box-shadow: 0 0 0 3px var(--focus-ring);\n  border-radius: var(--radius-xs);\n}\n\nhr { border: 0; border-top: 1px solid var(--border-subtle); margin: var(--space-5) 0; }\n\n/* Utility voice classes (optional) */\n.ds-overline {\n  font: var(--fw-semibold) var(--fs-overline)/1 var(--font-sans);\n  letter-spacing: var(--ls-overline);\n  text-transform: uppercase;\n  color: var(--text-gold);\n}\n.ds-display { font: var(--text-display); }\n.ds-hero    { font: var(--text-hero); }\n\n@media (prefers-reduced-motion: reduce) {\n  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }\n}\n\n<\u002Fstyle>\n  <script src=\"c03ee5b3-065a-43d8-97aa-26dda8e75596\"><\u002Fscript>\n  <script src=\"67eca5d7-1343-4652-b151-2245aae4e1c6\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; height: 100%; background: var(--root-700); color: var(--root-700); font-family: var(--font-sans); overflow: hidden; }\n    a { color: var(--clay-600); } a:hover { color: var(--clay-800); }\n    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"height: 100dvh; background: var(--root-700); display: flex; justify-content: center; padding-top: env(safe-area-inset-top);\">\n  <div style=\"width: 100%; max-width: 520px; height: 100%; display: flex; flex-direction: column; background: var(--ivory-100); overflow: hidden;\">\n\n    <header style=\"flex: none; background: var(--root-700); color: var(--mist-50); padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-inverse);\">\n      <img src=\"b9c0031f-90a4-4cea-8807-224f4fa4272b\" alt=\"\" style=\"width: 30px; height: 30px; flex: none;\">\n      <div style=\"display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;\">\n        <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.2; color: var(--mist-50);\">{{ headerTitle }}<\u002Fspan>\n        <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--clay-200);\">Stay Darlin' · Spirit guide<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div ref=\"{{ scrollRef }}\" style=\"flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;\">\n\n      <sc-if value=\"{{ isLearn }}\" hint-placeholder-val=\"{{ true }}\">\n        <div data-screen-label=\"Learn\" style=\"padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 22px;\">\n          <div style=\"background: var(--root-700); color: var(--mist-50); border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px;\">\n            <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--clay-200);\">Staff study guide · 9/29<\u002Fdiv>\n            <h1 style=\"margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; letter-spacing: -0.02em; color: var(--mist-50);\">Spirit tasting highlights<\u002Fh1>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.45; color: var(--text-inverse-dim);\">A quick-reference guide for recommending spirits with confidence.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--clay-600);\">Four steps, every time<\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column;\">\n              <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"display: grid; grid-template-columns: 44px 1fr; gap: 14px;\">\n                  <div style=\"display: flex; flex-direction: column; align-items: center;\">\n                    <div style=\"width: 44px; height: 44px; border-radius: 999px; background: var(--clay-600); color: var(--mist-50); display: flex; align-items: center; justify-content: center; flex: none;\">\n                      <x-import component-from-global-scope=\"DarlinDesignSystem_02528e.Icon\" name=\"{{ s.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import>\n                    <\u002Fdiv>\n                    <div style=\"flex: 1; width: 2px; background: {{ s.line }}; min-height: 14px;\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding: 4px 0 18px; display: flex; flex-direction: column; gap: 4px;\">\n                    <div style=\"display: flex; align-items: baseline; gap: 8px;\">\n                      <span style=\"font-family: var(--font-mono); font-size: 11px; color: var(--clay-400);\">{{ s.n }}<\u002Fspan>\n                      <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.02em; text-transform: uppercase;\">{{ s.title }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <span style=\"font-size: 15px; line-height: 1.45; color: var(--text-secondary);\">{{ s.body }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background: var(--clay-600); color: var(--mist-50); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 8px;\">\n            <div style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--clay-100);\">The goal<\u002Fdiv>\n            <p style=\"margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.35;\">Don't just name a more expensive spirit. Tell the guest what makes it different and why it fits what they already like.<\u002Fp>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: var(--clay-50);\">Use the tasting words as a starting point — not a script. Actual perception can vary.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <div style=\"font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--clay-600);\">The Darlin' rule<\u002Fdiv>\n            <sc-for list=\"{{ rules }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"background: var(--white); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start;\">\n                <span style=\"color: var(--clay-600); padding-top: 2px;\">\n                  <x-import component-from-global-scope=\"DarlinDesignSystem_02528e.Icon\" name=\"{{ r.icon }}\" size=\"{{ 20 }}\" hint-size=\"20px,20px\"><\u002Fx-import>\n                <\u002Fspan>\n                <div style=\"display: flex; flex-direction: column; gap: 3px;\">\n                  <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 16px;\">{{ r.title }}<\u002Fspan>\n                  <span style=\"font-size: 14px; line-height: 1.45; color: var(--text-secondary);\">{{ r.body }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ goQuiz }}\" style=\"all: unset; cursor: pointer; min-height: 52px; border-radius: 999px; background: var(--root-700); color: var(--mist-50); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px;\">\n            <x-import component-from-global-scope=\"DarlinDesignSystem_02528e.Icon\" name=\"circle-help\" size=\"{{ 18 }}\" hint-size=\"18px,18px\"><\u002Fx-import>\n            Ready? Take the quiz\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isFlavors }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Flavors\" style=\"padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <h2 style=\"margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1;\">When the guest says… reach for<\u002Fh2>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.45; color: var(--text-secondary);\">Each guest word has a color that follows the tasting notes everywhere. Tap a word to see every bottle that fits.<\u002Fp>\n          <\u002Fdiv>\n          <sc-for list=\"{{ guestWords }}\" as=\"g\" hint-placeholder-count=\"7\">\n            <div style=\"background: var(--white); border: 1px solid var(--border-subtle); border-radius: 16px; overflow: hidden;\">\n              <button sc-camel-on-click=\"{{ g.pick }}\" style=\"all: unset; cursor: pointer; width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: {{ g.bg }};\">\n                <span style=\"width: 16px; height: 16px; border-radius: 999px; background: {{ g.color }}; flex: none;\"><\u002Fspan>\n                <span style=\"display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0;\">\n                  <span style=\"font-family: var(--font-display); font-weight: 700; font-size: 20px; color: {{ g.fg }};\">“{{ g.word }}”<\u002Fspan>\n                  <span style=\"font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: {{ g.fg }};\">{{ g.label }} · {{ g.count }} bottles<\u002Fspan>\n                <\u002Fspan>\n                <x-import component-from-global-scope=\"DarlinDesignSystem_02528e.Icon\" name=\"chevron-right\" size=\"{{ 20 }}\" color=\"{{ g.fg }}\" hint-size=\"20px,20px\"><\u002Fx-import>\n              <\u002Fbutton>\n              <div style=\"padding: 4px 16px 8px; display: flex; flex-direction: column;\">\n                <sc-for list=\"{{ g.examples }}\" as=\"e\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ e.go }}\" style=\"all: unset; cursor: pointer; min-height: 44px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; border-bottom: 1px dotted var(--border-default);\">\n                    <span style=\"font-weight: 600;\">{{ e.name }}<\u002Fspan>\n                    <span style=\"color: var(--text-muted); font-size: 12px; text-align: right;\">{{ e.cat }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isFamilies }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-screen-label=\"Families\" style=\"padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 22px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n            <h2 style=\"margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1;\">Know the difference<\u002Fh2>\n            <sc-for list=\"{{ spectrums }}\" as=\"sp\" hint-placeholder-count=\"3\">\n              <div style=\"background: var(--root-700); color: var(--mist-50); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px;\">\n                <div style=\"display: flex; justify-content: space-between; align-item  'Ask → Listen → Recommend → Explain. “You’ll like this because…”' },\n  { prompt: 'Step one of every recommendation.', big: 'What do you ask first?', options: ['“What do you usually like?”', '“What’s your budget?”', '“Have you tried our most popular bottle?”'], say: 'Ask first: “What do you usually like?” Then listen for sweet, smooth, smoky, spicy, fruity or spirit-forward.' },\n  { prompt: 'A guest wants “something with a kick.”', big: 'What should you lean toward?', options: ['Intensity — spicy or higher-proof', 'The softest, lightest pour', 'A cream liqueur'], say: 'Use the guest’s language: if they want something with a kick, recommend intensity.' },\n  { prompt: 'Explaining the difference to a guest.', big: 'Which phrasing fits “know the difference”?', options: ['“This is smokier than what you had.”', '“They’re all basically the same.”', '“This one is just the premium version.”'], say: 'Know the difference: “This is sweeter / smokier / more oak-forward / more botanical.”' }\n];\n\nconst shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };\nconst pick = a => a[Math.floor(Math.random() * a.length)];\nconst nk = b => b.notes.map(n => n.t.toLowerCase()).join(', ');\nconst nstr = b => b.notes.map(n => n.t).join(', ');\nconst LETTERS = ['A', 'B', 'C', 'D'];\nconst CAT_ICONS = { whiskey: 'flame', tequila: 'sun', liqueur: 'citrus', vodka: 'snowflake', rum: 'palmtree', gin: 'leaf', mezcal: 'cloud-fog', scotch: 'mountain', cognac: 'grape', rule: 'scale' };\n\nfunction distinctFrom(b, pool, keyFn, n) {\n  const seen = new Set([keyFn(b)]); const out = [];\n  for (const x of shuffle(pool)) { const k = keyFn(x); if (!seen.has(k)) { seen.add(k); out.push(x); if (out.length === n) break; } }\n  return out;\n}\n\nfunction makeBottleQ(b, pool, type) {\n  const same = BOTTLES.filter(x => x.cat === b.cat);\n  const fb = { isBottle: true, name: b.name, style: b.style, notes: b.notes, say: b.say };\n  const base = { cat: b.cat, catName: b.catName, fb };\n  if (type === 'notes2bottle') {\n    let d = distinctFrom(b, same, nk, 3); if (d.length < 3) d = d.concat(distinctFrom(b, BOTTLES.filter(x => !d.includes(x)), nk, 3 - d.length));\n    const opts = shuffle([b, ...d]);\n    return { ...base, kind: 'Name the bottle', prompt: 'Which bottle tastes of…', big: nstr(b), sub: b.style, options: opts.map(x => ({ label: x.name, sub: x.style })), correct: opts.indexOf(b) };\n  }\n  if (type === 'bottle2notes') {\n    let d = distinctFrom(b, same, nk, 3); if (d.length < 3) d = d.concat(distinctFrom(b, BOTTLES, nk, 3 - d.length));\n    const opts = shuffle([b, ...d]);\n    return { ...base, kind: 'Tasting profile', prompt: 'What’s the tasting profile of…', big: b.name, sub: b.style, options: opts.map(x => ({ label: nstr(x) })), correct: opts.indexOf(b) };\n  }\n  const k = x => x.say;\n  let d = distinctFrom(b, same, k, 3); if (d.length < 3) d = d.concat(distinctFrom(b, BOTTLES, k, 3 - d.length));\n  const opts = shuffle([b, ...d]);\n  return { ...base, kind: 'Explain it', prompt: 'How would you explain this one to a guest?', big: b.name, sub: b.style, options: opts.map(x => ({ label: x.say })), correct: opts.indexOf(b) };\n}\n\nfunction makeGuestQ(pool, used) {\n  const g = pick(GUEST);\n  const fits = g.fam === 'adv' ? (b => ADV.test(b.say)) : (b => b.notes[0].f === g.fam);\n  const cands = pool.filter(b => fits(b) && !used.has(b.id));\n  if (!cands.length) return null;\n  const b = pick(cands);\n  const bad = shuffle(pool.filter(x => !matchFam(x, g.fam) && x.id !== b.id));\n  if (bad.length < 3) return null;\n  const opts = shuffle([b, ...bad.slice(0, 3)]);\n  const phrase = g.fam === 'adv' ? '“I want to try something different.”' : g.fam === 'oak' ? '“I like something spirit-forward.”' : `“I usually like something ${g.word.toLowerCase()}.”`;\n  return { cat: b.cat, catName: b.catName, id: b.id, kind: 'Guest match', prompt: 'A guest says…', big: phrase, sub: 'Which is the best fit?', options: opts.map(x => ({ label: x.name, sub: x.style })), correct: opts.indexOf(b), fb: { isBottle: true, name: b.name, style: b.style, notes: b.notes, say: b.say } };\n}\n\nfunction makeRuleQ(r) {\n  const opts = shuffle(r.options.map((o, i) => ({ label: o, ok: i === 0 })));\n  return { cat: 'rule', catName: 'The Darlin’ rule', kind: 'The Darlin’ rule', prompt: r.prompt, big: r.big, sub: '', options: opts.map(o => ({ label: o.label })), correct: opts.findIndex(o => o.ok), fb: { isRule: true, say: r.say } };\n}\n\nfunction buildQuiz(cats, n) {\n  const spirits = cats.filter(c => c !== 'rule');\n  const pool = BOTTLES.filter(b => spirits.includes(b.cat));\n  const wantRules = cats.includes('rule');\n  let nRules = wantRules ? (spirits.length ? Math.min(RULE_QS.length, Math.max(2, Math.round(n * 0.2))) : Math.min(n, RULE_QS.length)) : 0;\n  const qs = shuffle(RULE_QS).slice(0, nRules).map(makeRuleQ);\n  const used = new Set();\n  const types = ['notes2bottle', 'bottle2notes', 'bottle2say', 'guest'];\n  let guard = 0;\n  while (pool.length && qs.length < n && guard++ < n * 20) {\n    const t = pick(types);\n    if (t === 'guest') { const q = makeGuestQ(pool, used); if (q) { used.add(q.id); qs.push(q); } continue; }\n    const fresh = pool.filter(b => !used.has(b.id));\n    if (!fresh.length) break;\n    const b = pick(fresh); used.add(b.id);\n    qs.push(makeBottleQ(b, pool, t));\n  }\n  return shuffle(qs);\n}\n\nconst ALL_CATS = [...CATS.map(c => c.key), 'rule'];\nconst BEST_KEY = 'darlin-spirit-quiz-best';\n\n\n\nconst CHIP_CACHE = {};\nBOTTLES.forEach(b => { CHIP_CACHE[b.id] = b.notes.map(n => ({ t: n.t, color: FAM[n.f].color, bg: FAM[n.f].bg, fg: FAM[n.f].fg })); b.hay = (b.name + ' ' + b.style + ' ' + b.notes.map(n => n.t).join(' ') + ' ' + b.say).toLowerCase(); });\n\nconst TABS = [\n  { key: 'learn', label: 'Learn', icon: 'book-open', title: 'Spirit tasting highlights' },\n  { key: 'flavors', label: 'Flavors', icon: 'droplet', title: 'Guest words → flavors' },\n  { key: 'families', label: 'Families', icon: 'layers', title: 'Spirit families' },\n  { key: 'bottles', label: 'Bottles', icon: 'wine', title: 'Every bottle' },\n  { key: 'quiz', label: 'Quiz', icon: 'circle-help', title: 'Spirit quiz' }\n];\n\nclass Component extends DCLogic {\n  state = { tab: 'learn', cat: null, fam: null, q: '', qf: '', flash: false, revealed: {},\n    qScreen: 'setup', qCats: ALL_CATS.slice(), len: 10, qs: [], idx: 0, picked: null, answers: [], best: null };\n  scrollRef = React.createRef();\n\n  componentDidMount() {\n    if (location.protocol.startsWith('http') && !document.querySelector('link[rel=\"manifest\"]')) {\n      [['manifest', 'manifest.json'], ['apple-touch-icon', 'icon-180.png'], ['icon', 'icon-512.png']].forEach(([rel, href]) => {\n        const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);\n      });\n    }\n    try { const b = JSON.parse(localStorage.getItem(BEST_KEY) || 'null'); if (b) this.setState({ best: b }); } catch (e) {}\n  }\n  top() { setTimeout(() => { if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0; }, 0); }\n  go(tab, extra) { this.setState({ tab, ...(extra || {}) }); this.top(); }\n\n  startWith(qs) { if (!qs.length) return; this.setState({ qScreen: 'play', qs, idx: 0, picked: null, answers: [] }); this.top(); }\n  finish(answers) {\n    const right = answers.filter(a => a.ok).length;\n    const p = Math.round(right / answers.length * 100);\n    let best = this.state.best;\n    if (answers.length >= 10 && (!best || p > best.pct)) {\n      best = { pct: p, n: answers.length, date: new Date().toLocaleDateString() };\n      try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) {}\n    }\n    this.setState({ qScreen: 'results', answers, best }); this.top();\n  }\n\n  renderVals() {\n    const s = this.state;\n    const on = { bg: 'var(--clay-600)', fg: 'var(--mist-50)', bd: 'var(--clay-600)' };\n    const off = { bg: 'var(--white)', fg: 'var(--root-700)', bd: 'var(--border-default)' };\n    const tabDef = TABS.find(t => t.key === s.tab);\n\n    const tabs = TABS.map(t => ({ label: t.label, icon: t.icon, fg: s.tab === t.key ? 'var(--clay-600)' : 'var(--text-muted)', bg: s.tab === t.key ? 'var(--clay-50)' : 'transparent', fw: s.tab === t.key ? 700 : 500, go: () => this.go(t.key) }));\n    const steps = STEPS.map((st, i) => ({ ...st, line: i === STEPS.length - 1 ? 'transparent' : 'var(--clay-200)' }));\n\n    const guestWords = GUEST.map(g => {\n      const f = g.fam === 'adv' ? { label: g.label, bg: 'var(--clay-600)', fg: 'var(--mist-50)' } : FAM[g.fam];\n      return { word: g.word, label: f.label, color: g.fam === 'adv' ? 'var(--mist-50)' : f.color, bg: f.bg, fg: f.fg,\n        count: BOTTLES.filter(b => matchFam(b, g.fam)).length,\n        pick: () => this.go('bottles', { fam: g.fam, cat: null, q: '', qf: '' }),\n        examples: g.ex.map(name => { const b = BOTTLES.find(x => x.name === name); return { name, cat: b ? b.catName.split(' /')[0] : '', go: () => this.go('bottles', { q: name, qf: name, cat: null, fam: null }) }; }) };\n    });\n\n    const catTiles = CATS.map(c => {\n      const bs = BOTTLES.filter(b => b.cat === c.key); const fc = {}; let tot = 0;\n      bs.forEach(b => b.notes.forEach(n => { fc[n.f] = (fc[n.f] || 0) + 1; tot++; }));\n      return { name: c.name, count: bs.length, blurb: c.blurb,\n        fp: FAMS.filter(f => fc[f.key]).map(f => ({ w: (fc[f.key] / tot * 100).toFixed(1) + '%', color: f.color })),\n        pick: () => this.go('bottles', { cat: c.key, fam: null, q: '', qf: '' }) };\n    });\n\n    const ql = (s.qf || '').trim().toLowerCase();\n    const narrowed = !!(s.fam || ql);\n    const filtered = BOTTLES.filter(b => (!s.cat || b.cat === s.cat) && matchFam(b, s.fam) && (!ql || b.hay.includes(ql)));\n    const groups = s.tab !== 'bottles' ? [] : CATS.map(c => {\n      const matches = filtered.filter(b => b.cat === c.key);\n      const open = narrowed || !!s.cat || s.open === c.key;\n      const items = !open ? [] : matches.map(b => {\n        const show = !s.flash || !!s.revealed[b.id];\n        return { name: b.name, style: b.style, say: b.say, show, hidden: !show, cursor: s.flash ? 'pointer' : 'default',\n          notes: CHIP_CACHE[b.id],\n          reveal: () => s.flash && this.setState(st => ({ revealed: { ...st.revealed, [b.id]: !st.revealed[b.id] } })) };\n      });\n      return { name: c.name, count: matches.length + (matches.length === 1 ? ' bottle' : ' bottles'), items, total: matches.length,\n        chev: open ? 'chevron-up' : 'chevron-down',\n        toggle: () => { if (narrowed || s.cat) return; this.setState({ open: s.open === c.key ? null : c.key }); } };\n    }).filter(g => g.total);\n    const catChips = [{ key: null, name: 'All' }, ...CATS].map(c => ({ name: c.key ? c.name.split(' /')[0] : 'All', ...(s.cat === c.key ? on : off), pick: () => this.setState({ cat: c.key }) }));\n    const famChips = [...FAMS, { key: 'adv', label: 'Adventurous', color: 'var(--clay-600)' }].map(f => ({ label: f.label, color: s.fam === f.key ? 'var(--mist-50)' : f.color, ...(s.fam === f.key ? on : off), pick: () => this.setState({ fam: s.fam === f.key ? null : f.key }) }));\n\n    const qCatChips = [...CATS, { key: 'rule', name: 'The Darlin’ rule' }].map(c => ({ name: c.name.split(' /')[0], icon: CAT_ICONS[c.key], ...(s.qCats.includes(c.key) ? on : off),\n      pick: () => this.setState(st => ({ qCats: st.qCats.includes(c.key) ? st.qCats.filter(k => k !== c.key) : [...st.qCats, c.key] })) }));\n    const allOn = s.qCats.length === ALL_CATS.length;\n    const lenChips = [{ n: 10, label: 'Quick' }, { n: 25, label: 'Pre-shift' }, { n: 50, label: 'Deep study' }].map(l => ({ ...l, ...(s.len === l.n ? on : off), pick: () => this.setState({ len: l.n }) }));\n    const cq = s.qs[s.idx] || { options: [], fb: {} };\n    const answered = s.picked !== null;\n    const ok = answered && s.picked === cq.correct;\n    const options = cq.options.map((o, i) => {\n      let bd = 'var(--border-default)', bg = 'var(--white)', keyBg = 'var(--ivory-200)', keyFg = 'var(--root-700)', mark = '', markColor = 'inherit';\n      if (answered) {\n        if (i === cq.correct) { bd = 'var(--sage)'; bg = 'var(--sage-bg)'; keyBg = 'var(--sage)'; keyFg = 'var(--mist-50)'; mark = 'circle-check'; markColor = 'var(--sage)'; }\n        else if (i === s.picked) { bd = 'var(--brick)'; bg = 'var(--brick-bg)'; keyBg = 'var(--brick)'; keyFg = 'var(--mist-50)'; mark = 'circle-x'; markColor = 'var(--brick)'; }\n      }\n      return { key: LETTERS[i], label: o.label, sub: o.sub || '', bd, bg, keyBg, keyFg, mark, markColor, cursor: answered ? 'default' : 'pointer',\n        pick: () => { if (this.state.picked !== null) return; this.setState(st => ({ picked: i, answers: [...st.answers, { q: cq, picked: i, ok: i === cq.correct }] })); } };\n    });\n    const right = s.answers.filter(a => a.ok).length;\n    const isLast = s.idx === s.qs.length - 1;\n    const pctN = Math.round(right / (s.answers.length || 1) * 100);\n    const passed = pctN >= 80;\n    const byCat = {};\n    s.answers.forEach(a => { const k = a.q.catName; byCat[k] = byCat[k] || { r: 0, t: 0 }; byCat[k].t++; if (a.ok) byCat[k].r++; });\n    const missedA = s.answers.filter(a => !a.ok);\n\n    return {\n      headerTitle: tabDef.title, tabs,\n      isLearn: s.tab === 'learn', isFlavors: s.tab === 'flavors', isFamilies: s.tab === 'families', isBottles: s.tab === 'bottles', isQuiz: s.tab === 'quiz',\n      scrollRef: this.scrollRef,\n      steps, rules: RULES, spectrums: SPECTRUMS, legend: FAMS, guestWords, catTiles,\n      goQuiz: () => this.go('quiz'),\n      q: s.q, flash: s.flash, groups, catChips, famChips, hasFilters: !!(s.cat || s.fam || s.q), noResults: filtered.length === 0,\n      resultLine: `${filtered.length} of ${BOTTLES.length} bottles`,\n      onSearch: e => { const v = e.target.value; this.setState({ q: v }); clearTimeout(this.qt); this.qt = setTimeout(() => this.setState({ qf: v }), 220); },\n      toggleFlash: e => this.setState({ flash: e && e.target ? e.target.checked : !this.state.flash, revealed: {} }),\n      clearAll: () => this.setState({ cat: null, fam: null, q: '', qf: '' }),\n\n      qSetup: s.qScreen === 'setup', qPlay: s.qScreen === 'play', qResults: s.qScreen === 'results',\n      qCatChips, lenChips, toggleAllLabel: allOn ? 'Clear all' : 'Select all',\n      toggleAll: () => this.setState({ qCats: allOn ? [] : ALL_CATS.slice() }),\n      cantStart: s.qCats.length === 0,\n      hasBest: !!s.best, bestLine: s.best ? `${s.best.pct}% on ${s.best.n} · ${s.best.date}` : '',\n      start: () => this.startWith(buildQuiz(this.state.qCats, this.state.len)),\n      qNum: s.idx + 1, qTotal: s.qs.length, progress: ((s.idx + (answered ? 1 : 0)) / (s.qs.length || 1) * 100) + '%',\n      scoreSoFar: `${right} correct`, cq, options, answered,\n      fb: cq.fb, fbNotes: (cq.fb.notes || []).map(n => ({ t: n.t, color: FAM[n.f].color, bg: FAM[n.f].bg, fg: FAM[n.f].fg })),\n      fbBg: ok ? 'var(--sage-bg)' : 'var(--brick-bg)', fbFg: ok ? 'var(--sage)' : 'var(--brick)',\n      fbIcon: ok ? 'circle-check' : 'circle-x', fbTitle: ok ? 'That’s it.' : 'Not quite — here’s the answer.',\n      nextLabel: isLast ? 'See my results' : 'Next question',\n      next: () => { if (isLast) this.finish(this.state.answers); else { this.setState({ idx: s.idx + 1, picked: null }); this.top(); } },\n      quit: () => { if (this.state.answers.length) this.finish(this.state.answers); else this.setState({ qScreen: 'setup' }); },\n      pct: pctN + '%', resBg: passed ? 'var(--clay-600)' : 'var(--root-700)',\n      resEyebrow: passed ? 'Passed · 80% needed' : 'Keep studying · 80% needed',\n      resLine: `${right} of ${s.answers.length} correct`,\n      resMsg: passed ? 'You know the back bar. Pour with confidence.' : pctN >= 60 ? 'Close. Review what you missed, then take another pass.' : 'Review what you missed in Bottles, then take another pass.',\n      breakdown: Object.entries(byCat).map(([name, v]) => ({ name, score: `${v.r}/${v.t}`, w: (v.r / v.t * 100) + '%', color: v.r / v.t >= 0.8 ? 'var(--sage)' : 'var(--clay-600)' })),\n      hasMissed: missedA.length > 0,\n      missed: missedA.map(a => ({ prompt: a.q.prompt, big: a.q.big, yours: a.q.options[a.picked].label, right: a.q.options[a.q.correct].label, say: a.q.fb.say })),\n      retryMissed: () => this.startWith(shuffle(missedA.map(a => { const q2 = { ...a.q }; const order = shuffle(q2.options.map((o, i) => i)); q2.options = order.map(i => a.q.options[i]); q2.correct = order.indexOf(a.q.correct); return q2; }))),\n      restart: () => this.setState({ qScreen: 'setup', answers: [], qs: [], idx: 0, picked: null })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
